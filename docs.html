# The Content Engine
## One experiment → a week of posts. This is the machine that makes 1/day possible in ≤10 hrs/week.

---

## The rule

You never sit down to "make content." You sit down to **experiment** — the thing that runs on curiosity and doesn't deplete. Content is the harvest of the experiment, extracted afterwards in one batch session. If you're staring at a blank "what do I post" page, the engine is broken — go experiment instead.

## The weekly cycle (~10 hrs)

| Session | Time | What happens |
|---|---|---|
| **1. Experiment** | 1–2 hr | One genuine creative AI session. A new workflow, a restyle, a tool pushed somewhere new, a real piece for the portfolio. Capture screen recordings and outputs AS YOU GO (this is the only discipline required — record everything, decide later). |
| **2. Harvest + script** | ~2 hr | Run the harvest questions below against the session. Fill 7 calendar slots. Script them with the `tiktok-script-writer` skill. |
| **3. Film + edit (batch ×1–2)** | ~4 hr | Film all face/voiceover pieces in one sitting (same light, same setup, momentum). Assemble carousels from brand templates. Schedule the week. |
| **Daily: engage** | 15 min | Reply to every comment. This is the actual daily metric — conversations, not numbers. |

## The harvest questions (one session → 7 posts)

Ask these about every experiment session:

*(Pillars redefined 2026-07-26. There is no fixed mix — pick by energy. The one standing rule is the craft floor below.)*

**Pillar 1 — Opinion.** Perspective, experiences, thoughts and opinions — anything where the work, career, AI or building is the subject, including money and business honesty.
1. What did this session change about how I see AI / creativity / taste? → *thinking-out-loud talking-head*
2. What's the contrarian lesson — the thing everyone gets wrong? → *voiceover over the session's b-roll*
3. What decision did I make about the business this week, what did it cost, and what are the real numbers? → *honest talking-head*

**Pillar 2 — Teaching.** How-to's and tutorials, thinking and taste first, builds as the vehicle. Also carries the proof.
4. What's the exact workflow, and what's the transferable principle underneath it? → *screen demo or voiceover walkthrough (teach the thinking, name the tool second)*
5. What did I actually make, and what does it prove? → *before/after with voiceover, no face needed*

**Pillar 3 — Story.** Mum-life, the emotional posts, the story-side, why this is meaningful.
6. What was true about being a mum this week that has nothing to do with the build? → *talking-head or voiceover-over-footage*
   *Sort test:* strip every business/AI/career reference — if the post still works it's P3, if it collapses it's P1.

**Pillar 4 — Motivation.** Earned motivation, always anchored to something specific and true.
7. What did I learn the hard way that would change how someone else approaches this — and what's my evidence? → *talking-head or text-on-screen*

**The craft floor (replaces the old percentage mix):** every week ships **at least one Pillar 2 post that visibly shows real work.** P3 and P4 are broad-reach pillars carrying no craft payload; unpaired with visible output, the account becomes just another lifestyle account. This is the one non-negotiable in the weekly mix.

## The story thread (the wrapper — runs under every pillar, including the ones that aren't about her life)

The arc: **millennial mum, ten years into a corporate career that looks right and feels wrong — still in it, building a creative career on the side, on her own terms, time-poor and doing it anyway. One step ahead, figuring it out in public. Proof that you don't have to quit to start.** This is the wrapper on the whole account — it runs *under* all four pillars as context, and it is not the same thing as Pillar 3 (Pillar 3 is mum-life content in its own right; the thread is the arc that gives every pillar its context).

Why "still in it" beats "I got out": the story is live, not retrospective — there's real tension (will it work?), which is what makes people follow a daily account to see what happens next. And the time-poor constraint turns every efficiency claim into proof: the harvest engine isn't just the production system, it's content ("a week of posts from one hour, because one hour is what I had").

One boundary: never disparage the employer or make the day job identifiable. The story is "building the next thing," not "trashing the current one" — that's both the classier read and basic professional self-protection.

Rules:
- **Identification before information.** In any post carrying the thread, the viewer hears "she was where I am" before "she knows more than me." Lived experience opens; capability lands inside it.
- **At least 2–3 hooks per week open from the lived arc**, whatever the pillar — a teaching post can start "when I was doing this job at my desk in corporate.." before the workflow.
- **The line never crossed:** relatable in the story, expert in the craft. She is the guide one step ahead ("here's how I see this / here's how to do it"), never the guru on a stage — and never the fellow-struggler with nothing to teach. That fourth position is the saturated, moat-free one the strategy doc rejects.
- **Test, don't assume (from the strategy doc):** the corporate-mum resonance is a hypothesis to test cheaply. Tag story-led posts in the scorecard and watch who leans in — if story hooks outperform craft hooks in month 1, the data earns the thread more weight.
- **Specificity is the price of the story pillar.** Mum-life is now a pillar in its own right (P3), which means the old "motherhood stays context, not the category" rule is retired — but it's replaced by a harder one: P3 must be carried by *her* specific true details, never generic mum sentiment. Generic relatability with no craft payload is the commodity trap; lived specificity is what breaks the category expectation.

## Format rotation (burnout protection — built in, not optional)

Face-on-camera is spent where it earns most: Pillar 1 takes and Pillar 3 story posts. Everything else rotates through voiceover, text-on-screen, screen recording, and template carousels. **Never two consecutive days of full talking-head.** If a week feels heavy, shift the mix toward voiceover and carousels — the streak matters more than the format.

## Idea capture

Anything that sparks mid-week goes in `IDEA_INBOX.md` immediately, tagged by pillar, one line. No idea gets developed on capture — capture is 10 seconds, development happens in the harvest session.

## Algorithm checklist per post (2026)

- Hook in first 3 seconds (spoken + on-screen text)
- Built for completion — cut everything that doesn't earn the next second; 60–90s only if it holds
- Search keywords spoken aloud AND in caption AND on-screen text
- 3–5 hashtags, no more
- End with something save-worthy or share-worthy (the checklist, the take, the before/after)
- Crosspost to IG automatically. Zero bespoke IG work.

# The Research Engine
## Consistent content-idea supply, ≤45 min/week. Feeds the dashboard idea bank (`dashboard/data.json`) + a rolling insights log (`outputs/research/RESEARCH_LOG.md`) so you never face a blank "what do I post" page.

Companion to `ENGINE.md` (the production machine). This is the *idea-supply* machine that keeps it fed. Full rationale: `outputs/research/CREATOR_LANDSCAPE_TOPIC_ENGINE.md` §4.

---

## The through-line (the spine every idea ties back to)

**An engineer's systems/process brain + creative taste, applied to help time-poor women, millennials and mums build a sustainable income WITHOUT quitting their job or burning out — and balance work with family.**

Two co-equal moats: **systems/process thinking** (rarer than taste, and it's what the time-poor mum audience actually needs) and creative **taste**. AI is a recurring *tool* in service of the through-line — roughly **1 in 3** topics, never the constant subject.

Consistency model: **narrow anchor, broad topics.** The intersection above stays recognisable so the algorithm can find the audience in the first ~100 posts; the weekly *topics* range widely for fuel.

---

## The four layers

| Layer | Cadence | Status | What it does |
|---|---|---|---|
| **1. First-party comment mining** | Daily, 0 extra min | **[MANUAL]** | During the 15-min engagement block: every question, objection, or "this is so me" comment → added to the dashboard idea bank in the commenter's *exact words*. Highest-value layer; compounds as the account grows. A bot cannot do this. |
| **2. Automated weekly pulse** | Weekly (Sat ~8am) | **[AUTOMATED]** | The scheduled task `weekly-content-research-engine`. Rotates a topic, researches the last ~30 days, appends 6–9 on-spine ideas to the dashboard idea bank AND distils the week's trends/audience language into `RESEARCH_LOG.md`. Absorbs old Layer 4 (Reddit) too. |
| **3. Platform-native listening** | Weekly, ~15 min, phone | **[MANUAL]** | A normal TikTok scroll used as research: search 2 seed phrases → filter *This month* → note which hooks repeat (repetition = validated format); screenshot the most-liked comment-questions on the top 3 videos; check what your benchmark creators' best post this week was and reverse the *format*. |
| **4. Deep community mining** | Monthly, ~20 min | **[MOSTLY AUTOMATED]** | Now covered by Layer 2's rotation (it hits Reddit/forums). Optional manual top-up: skim r/workingmoms, r/Entrepreneur, r/sidehustle, r/graphic_design for emerging phrasing. |

The machine (Layer 2) **supplements** your audience's real words — it does not replace listening to them (Layers 1 & 3). Those two are the highest-signal and stay yours.

---

## Layer 2: the automated task

- **Task:** `weekly-content-research-engine` (Scheduled section in the sidebar).
- **Fires:** Saturday ~08:07 local (Brisbane), so ideas are waiting for the week's planning and your Day-7 "pick next experiment" glance.
- **Runs only while the Claude app is open.** If it's closed all weekend, it runs on next launch — a day or two late, not lost.
- **Output 1 — ideas:** appended to `dashboard/data.json` → `ideas[]` with sequential ids, `status: "inbox"`, and `notes` tagged `auto-harvest wk<N>`. Existing ideas are never edited or reordered. (If the GitHub values in `parameters.env` are filled in, the task pulls the live copy first and pushes back after — same protocol as CLAUDE.md; until then, local file.)
- **Output 2 — insights + hashtags:** a compact dated section appended to `outputs/research/RESEARCH_LOG.md` (trends, audience phrases verbatim, competitive signals, sources) — the *understanding* behind the ideas — plus a **"Hashtags this week (5)"** line chosen from the hashtag pool below.
- **Engine:** calls `/last30days` first, which falls back to WebSearch automatically (no `SCRAPECREATORS_API_KEY` set — that's fine; adding one later just enriches the data).

### The 6-week topic rotation (ISO-week mod 6)

| # | Weekly topic | Pillar | Moat led |
|---|---|---|---|
| 0 | Sustainable side income without the hustle — income/digital products as a busy woman/mum, anti-burnout | P1 *(some P4)* | — |
| 1 | Systems & time management — running a side-thing (and life) like a system when you're time-poor | P2 | **systems** |
| 2 | AI as leverage for busy women — practical tools/workflows that give hours back | P2 | *(AI)* |
| 3 | Taste & quality — making work that doesn't look AI-generated / beating AI slop | P2 | **taste** *(AI)* |
| 4 | The corporate career that looks right but feels wrong — staying not quitting, quiet ambition | P1 | — |
| 5 | Working-mum reality — ambition + family, invisible load, time-poverty, doing it anyway | P3 *(sort test: build-focused → P1)* | — |

Only #2 and #3 are AI-forward (≈1 in 3). The rest are income, systems, identity, life.

---

## The hashtag pool (weekly run picks 5, logs them to RESEARCH_LOG.md)

TikTok treats hashtags as its weakest search signal — so keywords must ALSO be spoken aloud and in on-screen text. Use **3–5 per post, never more.** Avoid dead weight (#fyp / #foryou / #viral) and bare #sidehustle (saturated, hustle-coded). AU spelling ("mum" not "mom").

**CORE (reuse most weeks — identity + positioning):**
`#workingmum` · `#mumsoftiktok` (or `#mumtok`) · `#quietambition` · `#buildinpublic` (softer alt: `#buildwithme`)

**TOPICAL buckets (pull 1–2 matching the week's rotation topic):**
| Rotation topic | Topical tags |
|---|---|
| 0 side income no-hustle | `#sidehustlemum` `#sidehustleforwomen` `#digitalproducts` |
| 1 systems & time | `#timemanagement` `#productivitytok` `#gettingorganised` |
| 2 AI leverage | `#aiforcreators` `#aitools` `#aiforsmallbusiness` |
| 3 taste & anti-slop | `#aiart` `#createwithtaste` `#aivsreal` |
| 4 corporate arc | `#careerchange` `#corporatelife` `#corporatetocreative` |
| 5 working-mum reality | `#workingmumlife` `#mumlife` `#balancenotburnout` |

**Weekly formula:** ~2 CORE + ~2 TOPICAL (this week's bucket) + 1 fresh/rising tag the run actually saw on high-performing posts in the research (only if real — else 3 core/topical). 

**Guardrail:** past the intro/story-setup weeks, **no more than 2 mum-coded tags** in a set — the account is energy-first, not mum-first (motherhood is context, not category). As topics broaden, rotate mum tags down and systems/income/taste tags up. The pool grows over time: when the run spots a genuinely rising tag, it notes it in RESEARCH_LOG.md so it can be promoted into a bucket here.

---

## The manual weekly checklist (≤20 min, wraps the automated drop)

Do this once a week, ideally when you sit down to plan (Day 2 harvest or Day 7 glance):

1. **Read the week's auto-harvest ideas** in the dashboard (notes tagged `auto-harvest`) and skim the new `RESEARCH_LOG.md` entry. Promote the 1–3 ideas that make you go "yes, that one" into the calendar; leave the rest.
2. **Layer 3 scroll (10 min):** the TikTok search + comment-screenshot routine above. Add anything sharp to the inbox in the commenter's words.
3. **Layer 1 review (kept from daily habit):** glance at your own best/most-asked comments this week — the single best one is often next week's post.
4. Filter to promote, always the same test: ***"Would the time-poor employed woman/mum in AUDIENCE_TERTIARY save or share this?"*** Everything else stays in the inbox or dies.

---

## Kill-switch

If the engine ever competes with filming time, **the engine loses.** Layer 1 (daily comment mining) alone can sustain idea supply indefinitely — Layers 2–4 are amplifiers, not requirements. The point is posting, not researching posting.

---

## Changing the machine

- **See it / check next run:** ask Claude to `list_scheduled_tasks`, or open the Scheduled section in the sidebar.
- **Change day/time, rotation, or topics:** ask Claude to update the task (`update_scheduled_task` on `weekly-content-research-engine`). The rotation table above is the source of truth — keep it and the task prompt in sync.
- **Pause it:** disable the task in the sidebar (e.g. during a heavy work crunch — the inbox already holds weeks of fuel).

---

*Built 2026-07-07; repointed to the dashboard + RESEARCH_LOG 2026-07-10 after the idea bank moved to `dashboard/data.json`. Seed run: week-28 topic (corporate-career arc) → ideas i70–i77 + the first RESEARCH_LOG entry.*

# The Weekly Operating System — 90 minutes a day, 1 post/day
## Task-based, not time-based: each block has ONE mode. Days can shuffle; modes never blend.
## Design logic: scripts/captions (her slowest, most draining stage) are delegated to Claude entirely. Her 90-minute blocks are spent on the energising work — experimenting, making, filming, assembling.

---

## The non-negotiable rules (these ARE the schedule)

1. **Never write from a blank page.** Claude drafts every script and caption via the `tiktok-script-writer` skill. Alison edits in her voice — **10 minutes max per script**, timer on. Editing a draft is fast; drafting is the sinkhole.
2. **Captions are born with scripts** — same session, same draft, never a separate task.
3. **Scripts lock on script day.** No rewriting on film day. If one feels wrong at the camera, swap in a different post from `IDEA_INBOX.md` — never rewrite live.
4. **Two-take rule.** Take 2 is the take. Take 3 only for a factual error. Build-in-public makes rough edges on-brand; the taste is in the ideas and visuals, not broadcast polish.
5. **Produce a week ahead.** This week's blocks make NEXT week's posts. Posting daily is a 2-minute act from a scheduled bank, not a daily production sprint.
6. **Engagement never comes out of the 90 minutes.** 10–15 min replying to comments happens from the phone in dead time (lunch, kettle, commute). It's the daily metric that matters — conversations.
7. **One real day off per week, protected.** The streak survives because the bank is full, not because Sunday was sacrificed.

---

## The week (default: evening blocks)

| Block | Mode | The 90 minutes |
|---|---|---|
| **Day 1 — EXPERIMENT** | Explore/create | The renewable session: one real creative AI experiment. Screen-record everything, save every output (they're the Pillar 2 proof posts + b-roll). End with a 5-min voice-note dump of what happened, what surprised you, what you'd tell someone. |
| **Day 2 — HARVEST + SCRIPT (with Claude)** | Edit, not write | Open a session, paste/say the voice-note dump. Claude drafts all 7 scripts + captions from the week's slots (no fixed pillar mix — but the craft floor holds: at least one P2 post that visibly shows real work). You edit each for voice — 10 min cap each. Lock all 7. |
| **Day 3 — FILM BATCH** | Perform once | All face content (2 talking-heads) + all voiceovers (2–3) in ONE sitting. Same setup, same light, momentum. Two-take rule. Screen demos trimmed from Day 1's recordings. |
| **Day 4 — EDIT BATCH 1** | Assemble | 3–4 posts: CapCut template, auto-captions, export. **20–25 min per post, timer on.** |
| **Day 5 — EDIT BATCH 2 + SCHEDULE** | Assemble | Remaining 3–4: carousel from brand template (no filming, no editing), before/after from Day 1 outputs. Schedule the full week. Bank closed. |
| **Day 6 — BUFFER / BUILD** | Flex | Whatever slipped gets caught here. If nothing slipped: this is where roadmap Phase 1–2 hours live — lead magnet, product, portfolio. Never new strategy docs. |
| **Day 7 — OFF** | Protected | One task only, 10 minutes: glance at the idea inbox, pick next week's experiment. Otherwise: off. |

**When the ~2-hour weekend block exists (not guaranteed, use when it appears):** it becomes FILM + EDIT combined (daylight, more room, one setup for the whole week), and the freed weekday evenings shift to BUILD. This is the accelerated week — take it when life allows, never depend on it.

**Early-morning option:** if an evening feels dead, the same block moves to morning. Mode stays the same; the schedule is task-based so the clock doesn't matter.

---

## Format budget per week (what makes 7/week affordable)

| Count | Format | Production cost |
|---|---|---|
| 2 | Talking-head (P1 takes + P3 story) | Filmed in one batch, 2 takes each |
| 2–3 | Voiceover (over b-roll / screen recording / stills from Day 1) | Recorded in minutes, edit is assembly |
| 1 | Carousel (TikTok photo-mode + IG) | Zero filming, zero video editing — template |
| 1 | Before/after or screen demo (P2 — this is the craft floor post) | Made FROM Day 1's outputs — already exists |

If a week collapses (sick kid, work crunch): the emergency post is always a carousel or a text-on-screen take from the idea inbox — 20 minutes, streak intact. Lowering the day's format is the plan working, not the plan failing.

---

## Time math (honest)

6 blocks × 90 min = 9 hrs + phone engagement ≈ 10–10.5 hrs. At the cap. Product/build hours only exist on Day 6 when production hasn't slipped — which is why rules 1–4 (speed rules) are what actually fund the business, not just the content.

## Review

Weekly scorecard (`SCORECARD.md`) on Day 5 or 6, 10 minutes, then closed. Day-30 gate: if the week is consistently overflowing its blocks, the pace decision gets made there — deliberately, with data.

# Growth Strategy — 0 → 1M Followers
## Alison Law · Teaching creative people to use AI with taste
### Created 4 July 2026 · Review at day 30, day 60, day 90

---

## The goal, honestly framed

1M followers is the **horizon**, not the plan. The plan is a staged climb — 0 → 1K → 10K → 100K — with review gates, at a pace of **1 post/day for 6 months (~180 posts)** inside ~10 hrs/week. The business the audience feeds is teaching + low-cost digital products (workflow guides), per `ALISON_LAW_BUSINESS_STRATEGY.md`.

Three facts from research that reframe the goal:

1. **Revenue arrives at 1K–10K followers, not 1M.** ~1K engaged followers can generate $2–5K/month with the right digital product; a $50–97 product at 2% conversion on an 8–10K audience = $10–15K per launch. The business validates two orders of magnitude before the vanity number.
2. **0 → 100K in 6–12 months is achievable** in education niches with consistency — education content drives saves and shares, now the heaviest-weighted algorithm signals.
3. **1M in 12 months part-time is an outlier outcome, not a plannable one.** Comparable AI-education creators (Riley Brown ~640K, Adam Digital ~530K, Tiffany Janzen 1M+ across platforms) got there with relentless cadence and repeatable formats over multi-year runs.

---

## What the 2026 TikTok algorithm rewards (research summary)

- **New accounts skip the follower-testing phase** — videos go straight to a small interest-matched test audience. Starting at zero is a mild advantage, not a penalty.
- **Completion rate is the virality bar: ~70%** (up from ~50% in 2024). Post for completion, not length — though 60–90s content watched through now earns extra weight.
- **Saves and shares outweigh likes.** Educational and perspective content drives exactly these.
- **The first 3 seconds decide everything** — 71% of users decide whether to keep watching in that window.
- **TikTok is a search engine** — ~40% of Gen Z search TikTok before Google. Keywords must appear in captions, on-screen text, and spoken words. 3–5 hashtags max.
- **Consistency signals commitment** — sporadic posting suppresses reach; the algorithm learns the audience faster at higher cadence.
- **Micro-niche discipline** — one recognisable thread for the first ~100 posts. The algorithm finds the audience faster when content is topically consistent.
- **Judgment window: 30 posts / 30 days minimum** before evaluating anything.

---

## Positioning (from the business strategy doc)

> **Update 2026-07-10 — broadened.** Two co-equal moats: engineer's **systems/process thinking** + creative **taste**. Territory: sustainable income + work/family balance for time-poor women, millennials and mums — AI is a tool in ~1 in 3 topics, not the constant subject. Model: "narrow anchor, broad topics." The bullets below predate this; where they read AI-taste-only, the broadened spine wins. See `content-engine/RESEARCH_ENGINE.md`.

- **Story is the wrapper. AI-creative expertise is the product.** Curious creative who happens to be a mum, not mum-first.
- **The wrapper is visible on everything:** the arc — millennial mum, still in the corporate career that looks right and feels wrong, building a creative career on the side, time-poor, proof you don't have to quit to start — opens 2–3 hooks per week across ALL pillars. Identification before information: "she was where I am" lands before "she knows more than me." Relatable in the story, expert in the craft — never fellow-struggler with nothing to teach (see `content-engine/ENGINE.md`, story thread).
- **The moat:** engineer + design-eye + AI edge — unique at that intersection. Never trade it for a saturated demographic angle.
- **Posture:** the guide ("here's how I see this"), not the student ("watch me try this").
- **Audience:** sorted by energy — curious, ambitious, alive makers — not by profession or demographic.
- **Value on offer:** take someone who feels behind on AI and afraid of looking amateur → capability, confidence, taste.

---

## Content system: four pillars, one engine

**Not a tutorial channel.** Tutorials-only is the treadmill that caused the last burnout. *(Pillars redefined 2026-07-26. There is no fixed percentage mix — she picks by energy, one week at a time. The single standing rule is the craft floor below.)*

| Pillar | What it is | Primary formats |
|---|---|---|
| 1. Opinion | Perspective, experiences, thoughts and opinions — anything where the work, career, AI or building is the subject. Carries money honesty, business decisions and trade-offs, market critique. | Talking-to-camera / thinking-out-loud; text-on-screen takes; voiceover over b-roll |
| 2. Teaching | How-to's and tutorials — the thinking and the taste first, her builds and technical explorations as the vehicle. **Carries the proof**: show-the-work, portfolio pieces, before/afters. | Screen-recording demos (face hook + payoff); voiceover walkthroughs; before/after; carousel breakdowns |
| 3. Story | Mum-life, the emotional posts, the story-side, why it's meaningful. Stands alone — a mum with no side-business still relates. The audience-capture pillar. | Voiceover-over-footage; honest talking-head; text-on-screen |
| 4. Motivation | Earned motivation and growth mindset, always anchored to a specific true thing she did, learned or measured. | Talking-head; text-on-screen; voiceover |

**The craft floor.** Every week ships at least one Pillar 2 post that visibly shows real work. Pillars 3 and 4 are broad-reach with no craft payload — unpaired with visible output, the account drifts into the lifestyle-commodity trap the audience research names. This floor replaces the old percentage mix.

Face-on-camera is concentrated where it pays most (Pillar 1 takes, Pillar 3 story posts). Voiceover and template-based carousels carry the rest. Carousels come from repeatable brand-system templates — never bespoke one-offs.

**The engine — one activity, harvested four ways.** One genuine experimenting session per week produces:
- the session itself, and what it changed about how she sees things → Pillar 1 opinion post(s)
- the teardown of how it worked, plus the outputs as proof → Pillar 2 teaching post(s)
- what was true about the week as a mum, independent of the build → Pillar 3 story post
- what she learned the hard way, with the evidence → Pillar 4 motivation post

One hour of real work → a week of posts. This — not willpower — is what makes 1/day survivable in ≤10 hrs/week. See `content-engine/ENGINE.md`.

**Weekly rhythm (~10 hrs):**
1 experiment session (1–2 hr) → 1 harvest/scripting session with the `tiktok-script-writer` skill (2 hr) → 1–2 batch film/edit sessions (~4 hr) → daily 15-min engagement, replying to every comment.

**Platform:** TikTok primary (video + photo-mode carousels). Instagram = auto-crosspost echo, zero bespoke effort.

---

## Phased milestones and gates

| Phase | Target | Gate / review |
|---|---|---|
| **0. Ship (week 1)** | Post #1 live within 7 days — a Pillar-1 opinion post that claims expertise directly. Build the harvest/idea-capture system same week. | Hard gate: no other brand/skill work until post #1 is live |
| **1. Days 1–30** | 30 posts at 1/day, craft floor held every week; identify 2–3 outperforming hook/format patterns | Day-30 review: signal (completion %, saves, shares, conversations) + **sustainability check** — if 1/day isn't holding inside ~10 hrs/wk, drop to 4–5/wk deliberately, don't crash |
| **2. Days 30–60** | 60 posts; email capture live (link-in-bio lead magnet); first digital product scoped and soft-launched | Real-signal check: conversations and "this helped me," or well-produced silence? Name it either way |
| **3. Days 60–90** | 90 posts; validation trigger review | **Decide, don't drift:** promote pivot to strategy, or honestly revisit — including the archived April production model |
| **4. Months 3–6** | 180 posts; double down on winners; Pillar 2 proof posts filling from accumulated work; product launch push at ~10K followers | Monthly scorecard; 0→10K+ realistic in this window |
| **5. Months 6–12** | Sustain/adjust pace on real data; duets & collabs with adjacent AI creators; 100K push | At 100K: re-plan toward 1M with first-party data (year-2 horizon) |

---

## Metrics — the guardrail is structural

The last content run ended via a specific mechanism: effort in → quiet numbers back → self-worth conclusion → quit. So:

- **Daily scoreboard (the only numbers checked daily):** real conversations, replies, "this helped me."
- **Weekly review only:** completion rate → saves → shares → email subscribers → followers → revenue. Followers deliberately near the bottom. Never checked on a clock.
- Weekly scorecard template: `content-engine/SCORECARD.md`.

# Long-Term Roadmap — The Freedom-Led Career
## Alison Law · Created 5 July 2026 · Review quarterly, or at each phase gate
### Companion to `GROWTH_STRATEGY_1M.md` (audience engine) and `ALISON_LAW_BUSINESS_STRATEGY.md` (living strategy)

---

## The destination (quantified for the first time)

- **The Tuesday vision** is the actual goal: flexible family mornings, deep-focus work, home by late afternoon. Income and audience are instruments.
- **Replace-salary target: $10–15K/month AUD** from the business.
- **Exit appetite: as fast as possible, 12–18 months** — but trigger-based, not date-based (see the triangle below).
- **Hour cap: ~10 hrs/week, firm.** This is not a limitation on the plan; it IS the plan. A freedom-led career built by sacrificing family time is a contradiction.
- **Parents' retirement**: the deepest driver, explicitly a Phase 6 horizon (~$20K+/mo territory). Named so it stops being unspoken pressure on every near-term number.

## The triangle — named honestly

**10 hrs/week + $10–15K/month + exit in 12–18 months: pick two.** From a zero audience, all three together is not a plan, it's a hope. Resolution chosen here:

1. **The hour cap is sacred** (it's the point of the whole thing).
2. **The income target is sacred** (it's what makes the exit real).
3. **The timeline flexes via a staged exit:** instead of one leap at month 18, drop to a 4-day corporate week when business income consistently exceeds ~20% of salary. That trade is financially neutral and buys back ~8 hrs/week — which accelerates everything after it. Full exit when business income holds at $10K+/mo for 6 consecutive months with a 6-month expense buffer banked. Realistic full-exit window: **18–30 months**, aggressive case 18.

## The income ladder (sequenced to psychology as well as maths)

The preference ranking from the July interview (products → 1:1 → cohorts → B2B) tracks rejection-exposure, not income. The ladder below respects the fear where it can and refuses to let it set the ceiling:

| Rung | What | Price | Why it fits | When |
|---|---|---|---|---|
| 1. Digital products | Workflow guide → style-reference system (product candidate already in IDEA_INBOX) | $27–97 | No live rejection risk; built once; validates the pivot with a first sale | Scope mo 2, launch mo 3–4 |
| 2. Flagship product | Deeper course/system, taught not performed | $97–197 | Products alone at this tier can carry $2–4K/mo at ~10K audience | Mo 6–9 |
| 3. Live small-group cohort | 4–6 wk "AI with taste" for creatives, 8–12 seats | $400–600 | **Convener mode — her strongest identity.** Sold inbound to warm audience; zero cold outreach. One cohort ≈ $4–6K | First run mo 9–12, then every 6–8 wks |
| 4. 1:1 workflow sessions | Quiet offer, Studio-Diagnostic style (carried from April model) | $150–300/session | Private, energising, no broadcast | Offered from mo 6, never scaled |
| 5. B2B team training | Half-day AI workshops for studios/agencies/teams | $2–5K/engagement | **Inbound only.** Content brings them; she never cold-pitches. Corporate fluency = unfair advantage | Accept from mo 12 when it knocks |

**Path to $10–15K/mo (illustrative, ~mo 18–24):** products $3–4K + one cohort/6 wks ≈ $3–4K/mo averaged + 2–4 1:1s $1K + one B2B/quarter averaged $1–2K ≈ $8–11K/mo, growing with audience. All deliverable inside ~10 hrs/wk because content hours shrink as library and templates compound.

**Prerequisite action (this month):** check employment contract for moonlighting/conflict clauses BEFORE first paid offer. Boring, essential, protects the whole bridge.

## The phases

**Phase 0 — Ship (now → day 30).** Post #1 by 11 July. 30 posts. No new strategy documents — this roadmap is the last one until the day-90 review. *Gate: streak alive, engine sustainable.*

**Phase 1 — Own the audience (mo 1–3).** Day-30 review makes the pace decision honestly: at a 10-hr cap, 1/day leaves no build hours — expect to drop to ~5/wk and reallocate ~3 hrs/wk to building. Email capture live by ~day 45 (lead magnet = slice of the future product). *Gate: ~1K followers, first 100–300 email subscribers, real "this helped me" signals.*

**Phase 2 — First money (mo 3–6).** Launch rung-1 product to the list, whatever its size. The goal is not income; it's the **first sale — the validation trigger** that promotes the whole pivot from hypothesis to strategy per the business strategy doc. *Gate: pivot validated (or honestly revisited, per the doc's 60–90 day clause).*

**Phase 3 — The ladder (mo 6–12).** Flagship product; quiet 1:1 offer; first cohort when audience ≈ 5–10K. Host one small in-person gathering in Brisbane before mo 12 — a $0-stakes test of the convener/hub identity (see below). *Gate: $3–5K/mo by mo 12.*

**Phase 4 — Staged exit (mo 12–18).** Cohort rhythm; inbound B2B accepted. When business income > ~20% of salary for 3 consecutive months → **drop to 4-day corporate week.** The reclaimed day goes to the business, not to more content — to delivery and product. *Gate: $8–10K/mo; full-exit trigger armed.*

**Phase 5 — Full exit (mo 18–30).** Exit when $10K+/mo holds 6 months + 6-month buffer banked. Post-exit hours rise only to ~20–25/wk — the Tuesday vision is the constraint, not a treadmill with a nicer boss. Community/membership layer starts here, not before.

**Phase 6 — Horizon.** Parents' retirement fund; the creative hub — grown from the gatherings that started in Phase 3, so that by the time it needs a building it already has a community. (The hub stays under the periodic honest question the strategy doc requires: destination, or comfortable distance?)

## Standing guardrails (from the personal context file — structural, not optional)

1. **The ruler check (monthly):** is any number being read as a verdict on her rather than data about a post/product? That mechanism — effort in, quiet numbers, self-worth conclusion, quit — has ended a run before. Catch it in the review, by name.
2. **Wrapper-creep check (monthly):** is the content drifting toward pure relatable-story (safe) and away from authority/teaching content (sells)? The instrument is now the **craft floor** — at least one Pillar 2 post visibly showing real work every week (the percentage mix was retired 2026-07-26). Check the weekly scorecards: a run of weeks where the floor was missed is the drift, in data.
3. **Preparing-vs-acting check (every session):** the shipping check in CLAUDE.md. Strategy documents are now rationed: no new ones until a phase gate.
4. **Followers are instrumental.** 1M remains the horizon metric of the growth plan, but this roadmap's north-star pair is **income per month + hours per week**. The email list, not the follower count, is the business asset.
5. **Fear vs genuine no:** products-first preference partially = rejection avoidance (named 5 July). Cohorts and inbound B2B are the compromise that honours the fear without letting it set the income ceiling. If cohort-avoidance appears at mo 9–12, name it as the block, not a strategy choice.
6. **One decision, kept.** Clarity follows commitment. The pivot's validation is Phase 2's first sale — until then, no new directions get built, however good tonight's idea feels. Date it before marrying it.

## Review rhythm

- **Weekly:** scorecard only (`content-engine/SCORECARD.md`).
- **Monthly:** guardrails 1–2 + phase progress.
- **Phase gates:** the only places strategy may change.
- **Fold into `ALISON_LAW_BUSINESS_STRATEGY.md`** at the day-90 validation review — not before.

The buyer's problem is NOT "I can't use AI" — it's "everything I make with AI looks generic and I'm afraid it looks amateur." The fix being sold: **a repeatable style-reference system built BEFORE any generation** — codify your taste once (references, palette, light, mood, composition rules, banned clichés) into a reusable brief, then direct every tool with it. Teach the thinking, name tools second (this answers the #1 course regret found in research: tool-specific courses go stale).

## Structure spec (draft in Markdown → `outputs/guides/PRODUCT_STYLE_REFERENCE_DRAFT.md`)
1. **Open (1 page):** the generic-results problem, named in her voice; the promise (consistent, yours, in minutes not hours).
2. **The idea (1–2 pages):** taste is direction, not generation. Why a style reference beats better prompts. The engineer's framing: a system with the same inputs produces consistent outcomes.
3. **The build (core, ~5 steps):** (a) harvest your taste — pull 10–15 references you love, name WHY in plain words; (b) extract the variables — light, palette, texture, composition, mood, era/medium; (c) write the reference brief — her 5-part template; (d) the banned list — clichés and tells to exclude; (e) test-and-tighten loop — 3 generations, compare against references, adjust the brief not the prompt.
4. **Worked example:** her own film-camera interior style, walked from Pinterest board → `STYLE_PROFILE.json`-style brief → before/after images (leave image placeholders + exact captions).
5. **Templates (the actual value):** blank style-reference brief; the extraction worksheet; the banned-list starter; a quick-start one-pager.
6. **Close:** what changes now; one honest line about her (still-in-corporate, after-bedtime hours); no hard sell of anything else.

Target length: 2,500–4,000 words + templates. Written entirely in her voice per Section 0.

## Process
Block 1: full draft. **Stop and show Alison the outline after Section 2 is drafted** — get a yes before writing the rest. Block 2 (separate session/week): revision pass against the acceptance checklist, then hand to `/brand-guidelines` PDF formatting as a later, separate job.

## Acceptance checklist
- [ ] Passes the calibration test on every page; zero banned words
- [ ] Tool-agnostic: works if the reader uses Midjourney, nano banana, or whatever ships next year
- [ ] A beginner who "feels behind" can execute step (a) within 30 minutes of reading
- [ ] The worked example uses HER real style, not an invented one
- [ ] Templates are genuinely usable standalone (the product survives skim-readers)
- [ ] No income claims, no "this changed my life" energy, no fake scarcity

## Failure modes
Drifting into a generic "50 AI tips" listicle; teaching prompts instead of the reference system; expert-from-above register; inventing a fake case study instead of using her style profile; padding to feel like "enough pages" (density is the value, not length).

# Agent Orchestra Plan — Build-in-Public Series
**Created:** 2026-07-18 · **Orchestrator:** Claude Fable 5 · **Status:** Ready to execute

## What this is
Fifteen build-in-public projects (income-side and balance-side builds for the time-poor
women/mums audience), each broken into delegable subtasks for lower models, with the
quality gates the orchestrator applies before any output is accepted. Say **"execute
Build N"** in a session and the orchestrator will spawn the subagents per that build's
brief, review their output against the gates, and hand back only approved work.

**Reality check (standing):** `dashboard/data.json` `postLog` is empty as of 2026-07-18.
No build in this file starts until post #1 is filmed. Build 6 is the exception — its
day-1 episode can *be* post #1.

---

## Part 1 — Orchestration rules (apply to every build)

### 1.1 Model routing

| Task type | Model | Why |
|---|---|---|
| Research, competitor scans, data pulls, file scaffolding, HTML/JS/spreadsheet builds, JSON wrangling | **Sonnet 5** | Fast, cheap, excellent at bounded technical work with clear acceptance criteria |
| Brand-facing copy, product content, scripts, naming, anything a customer or follower reads | **Opus 4.8** | Voice-sensitive work degrades fastest on smaller models; Opus holds register with good context |
| Mechanical transforms (format conversion, checklist expansion, alt-text, file renames) | **Haiku 4.5** | Trivial work, no judgment required |
| Positioning calls, pricing decisions, evidence/genericness judgment, final voice sign-off, anything ambiguous | **Orchestrator (Fable)** — never delegated | These are the failure points; a subagent can't know what it doesn't know |

Routing heuristic: **delegate the verifiable, keep the debatable.** If output quality can
be checked against a written criterion, delegate it. If checking it requires taste or
context about Alison, it stays with the orchestrator.

### 1.2 Mandatory context injection
Subagents start cold — they see none of this conversation. Every delegated prompt MUST
include, verbatim in the brief:

1. **Audience line:** "Time-poor women, millennials and mums building sustainable income
   without quitting or burning out. Energy-first, not demographic. AI is a tool in ~1 of
   3 topics, never the constant subject."
2. **Files to read before working** (paths are relative to project root):
   - Any customer/follower-facing words → `brand/BRAND_SYSTEM.md` + `brand/MESSAGING_BANK.md`
   - Visuals/design → `brand/STYLE_PROFILE.json` + `/brand-guidelines` skill
   - Content targeting → `/target-audience` skill, `outputs/research/AUDIENCE_TERTIARY.md`
   - TikTok scripts → the `tiktok-script-writer` skill (never freehand voice)
3. **Voice guardrail (paste verbatim into copy briefs):** "Warm, conversational TikTok
   register — talking to a creative she respects, not lecturing an audience. No
   declarative authority voice, no hustle-culture phrasing, no 'girlboss', no
   productivity-guru cadence. Small true numbers beat big claimed ones."
4. **Constraint frame:** everything is built in ~90 min/day sessions, after bedtime.
   Deliverables that assume a free weekend are automatically rejected.

### 1.3 Quality gates (orchestrator review, before anything is accepted)
Every subagent deliverable passes through, in order:

- **G1 Spec check** — did it deliver exactly what the brief asked, in the file/location
  named? Missing pieces → bounce back with the gap named, don't patch it yourself.
- **G2 Voice check** — read 3 random sentences aloud. Test: *"Would Alison say this to a
  creative she respects?"* One failure → return whole piece with the failing sentences
  quoted. Never line-edit a voice failure; the rewrite must come from the subagent so the
  register is consistent throughout.
- **G3 Truth check** — every number, claim, and price is either Alison's real data or
  clearly framed as an example. No invented testimonials, no implied results. Hard reject.
- **G4 Constraint check** — could Alison actually execute/film this in the stated
  time-box? If a "quick build" needs 6 hours, the brief was wrong; re-scope.
- **G5 Evidence check** — Builds 7, 8, 12 & 15 only: is the framing anchored in Alison's
  own specific evidence — a thing she actually built, ran, or measured — rather than
  generic productivity/mum hacks anyone could have written? (Rewritten 2026-07-26: mum-life
  is now a legitimate pillar in its own right (P3), so the old "productivity-hacks pillar was
  excluded" rule no longer applies. What is still excluded is *genericness* — the failure
  mode is a build that reads like the saturated "5 hacks for busy mums" category, not one
  that touches mum territory at all.)

Max 2 bounce cycles per subtask. A third failure means the brief is at fault — the
orchestrator rewrites the brief, not the output.

### 1.4 Delegation prompt template
```
ROLE: You are a [Sonnet 5/Opus 4.8] subagent for Alison Law's build-in-public series.
CONTEXT: [audience line + constraint frame from 1.2]
READ FIRST: [file list]
TASK: [single bounded deliverable]
OUTPUT: [exact path + format]
ACCEPTANCE CRITERIA: [numbered, checkable list — the orchestrator rejects against these]
DO NOT: invent numbers, invent testimonials, use hustle-culture voice, exceed scope.
If information is missing, output QUESTIONS as a list instead of guessing.
```

### 1.5 Content capture (all builds)
Each build is also a content series. Every subtask brief ends with a **capture note**:
what Alison screenshots/films at that step (the messy middle, not just the result).
Capture assets land in `outputs/visuals/build-N/`. Scripts for episodes are written by
Opus 4.8 via the `tiktok-script-writer` skill, one episode per completed milestone,
serialised ("Building X without quitting — day N" per i18).

/* ---- minimal markdown → HTML renderer (headers, bold/italic, links, code,
   tables, lists, blockquote, hr, fenced code, checkboxes) ---- */
function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inline(s){
  s = escHtml(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  return s;
}
function renderMarkdown(md){
  const lines = md.replace(/\r\n/g,'\n').split('\n');
  let html = '', i = 0, pendingSubH = false;
  let inList = null; // 'ul' | 'ol'
  function closeList(){ if(inList){ html += `</${inList}>`; inList = null; } }
  while(i < lines.length){
    let line = lines[i];
    if(/^\s*$/.test(line)){ closeList(); i++; continue; }
    if(/^```/.test(line)){
      closeList(); pendingSubH = false;
      let code = []; i++;
      while(i < lines.length && !/^```/.test(lines[i])){ code.push(lines[i]); i++; }
      i++; // skip closing fence
      html += `<pre class="codeblock"><code>${escHtml(code.join('\n'))}</code></pre>`;
      continue;
    }
    if(/^---+\s*$/.test(line)){ closeList(); pendingSubH = false; html += '<hr>'; i++; continue; }
    let m;
    if((m = line.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)/))){
      pendingSubH = false;
      if(inList !== 'ul'){ closeList(); html += '<ul>'; inList = 'ul'; }
      html += `<li class="task">${m[1].trim()?'☑':'☐'} ${inline(m[2])}</li>`; i++; continue;
    }
    if((m = line.match(/^###\s+(.*)/))){ closeList(); pendingSubH = false; html += `<h3>${inline(m[1])}</h3>`; i++; continue; }
    if((m = line.match(/^##\s+(.*)/))){
      closeList();
      if(pendingSubH){ html += `<h2 class="sub-h">${inline(m[1])}</h2>`; pendingSubH = false; }
      else html += `<h2>${inline(m[1])}</h2>`;
      i++; continue;
    }
    if((m = line.match(/^#\s+(.*)/))){ closeList(); html += `<h1>${inline(m[1])}</h1>`; pendingSubH = true; i++; continue; }
    if((m = line.match(/^>\s?(.*)/))){
      closeList(); pendingSubH = false;
      let bq = [m[1]]; i++;
      while(i < lines.length && /^>\s?/.test(lines[i])){ bq.push(lines[i].replace(/^>\s?/,'')); i++; }
      html += `<blockquote>${bq.map(inline).join('<br>')}</blockquote>`;
      continue;
    }
    if(/^\|/.test(line)){
      closeList(); pendingSubH = false;
      let rows = [];
      while(i < lines.length && /^\|/.test(lines[i])){ rows.push(lines[i]); i++; }
      rows = rows.filter(r => !/^\|[\s:|-]+\|$/.test(r.trim()));
      const cells = r => r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head = cells(rows[0]);
      const body = rows.slice(1).map(cells);
      html += '<div class="doc-table-wrap"><table><thead><tr>' +
        head.map(h=>`<th>${inline(h)}</th>`).join('') + '</tr></thead><tbody>' +
        body.map(r=>'<tr>'+r.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('') +
        '</tbody></table></div>';
      continue;
    }
    if((m = line.match(/^\s*[-*]\s+(.*)/))){
      pendingSubH = false;
      if(inList !== 'ul'){ closeList(); html += '<ul>'; inList = 'ul'; }
      html += `<li>${inline(m[1])}</li>`; i++; continue;
    }
    if((m = line.match(/^\s*\d+\.\s+(.*)/))){
      pendingSubH = false;
      if(inList !== 'ol'){ closeList(); html += '<ol>'; inList = 'ol'; }
      html += `<li>${inline(m[1])}</li>`; i++; continue;
    }
    // plain paragraph — accumulate following non-blank plain lines
    closeList(); pendingSubH = false;
    let para = [line]; i++;
    while(i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,3}\s|>|---+\s*$|\|)/.test(lines[i]) && !/^\s*[-*]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i])){
      para.push(lines[i]); i++;
    }
    const isMeta = /^(Created|Companion to|Built)/.test(para[0]);
    html += `<p class="${isMeta?'meta-line':''}">${para.map(inline).join(' ')}</p>`;
  }
  closeList();
  return html;
}

  history.replaceState(null,'','#'+key);
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => showDoc(b.dataset.doc)));

const initial = (location.hash||'').replace('#','');
showDoc(DOC_META[initial] ? initial : 'engine');
</script>
</body>
